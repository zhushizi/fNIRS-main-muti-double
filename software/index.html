<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fNIRS 单通道控制面板</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    body { background: #f7f7f9; }
    .card { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
    .mono { font-family: Consolas, Monaco, monospace; }
    .status-badge { font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="row">
      <div class="col-lg-5 mb-4">
        <div class="card">
          <div class="card-header">协议控制</div>
          <div class="card-body">
            <p class="text-muted">
              当前页面按 26B 协议发送 `0x01` 指令帧，并等待 `0x03` ACK。
            </p>
            <div class="form-group form-check">
              <input type="checkbox" class="form-check-input" id="streamEnabled">
              <label class="form-check-label" for="streamEnabled">启动采集</label>
            </div>
            <div class="form-group">
              <label for="intensityMa">光强 / 电流值</label>
              <input type="number" class="form-control mono" id="intensityMa" min="0" max="255" value="200">
            </div>
            <button class="btn btn-dark btn-block" id="sendButton">发送控制命令</button>
            <div class="mt-3">
              <div>串口: <span id="serialPort" class="mono">-</span></div>
              <div>波特率: <span id="baudRate" class="mono">-</span></div>
              <div class="mt-2">
                <span class="badge badge-secondary status-badge" id="ackStatus">等待发送</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card mb-4">
          <div class="card-header">最新数据帧</div>
          <div class="card-body">
            <table class="table table-sm">
              <tbody>
                <tr><th>时间</th><td id="latestTimestamp" class="mono">-</td></tr>
                <tr><th>波长编号</th><td id="latestWavelength" class="mono">-</td></tr>
                <tr><th>传感器编号</th><td id="latestSensorId" class="mono">-</td></tr>
                <tr><th>采集值</th><td id="latestValue" class="mono">-</td></tr>
                <tr><th>实时采样率</th><td id="samplingRateHz" class="mono">-</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-header">最近 20 帧</div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-striped table-sm mb-0">
                <thead>
                  <tr>
                    <th>时间</th>
                    <th>波长</th>
                    <th>传感器</th>
                    <th>值</th>
                  </tr>
                </thead>
                <tbody id="historyBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ackStatus = document.getElementById("ackStatus");
    let requestInFlight = false;

    function wavelengthLabel(code) {
      if (code === 0) return "0x00 / 未点亮";
      if (code === 1) return "0x01 / 940nm";
      if (code === 2) return "0x02 / 660nm";
      return "0x" + Number(code ?? 0).toString(16).toUpperCase().padStart(2, "0");
    }

    async function refreshStatus() {
      if (requestInFlight) {
        return;
      }

      const response = await fetch("/api/status");
      const data = await response.json();

      document.getElementById("serialPort").textContent = data.serial_port || "-";
      document.getElementById("baudRate").textContent = data.baud_rate || "-";
      document.getElementById("streamEnabled").checked = !!data.control_state.stream_enabled;
      document.getElementById("intensityMa").value = data.control_state.intensity_ma;

      if (data.control_state.last_command_ok === true) {
        ackStatus.textContent = "最近一次命令: 已发送";
        ackStatus.className = "badge badge-success status-badge";
      } else if (data.control_state.last_command_ok === false) {
        ackStatus.textContent = "最近一次命令: 发送失败";
        ackStatus.className = "badge badge-danger status-badge";
      }

      const latest = data.latest_packet;
      document.getElementById("latestTimestamp").textContent = latest ? latest.timestamp : "-";
      document.getElementById("latestWavelength").textContent = latest ? wavelengthLabel(latest.wavelength_code) : "-";
      document.getElementById("latestSensorId").textContent = latest ? latest.sensor_id : "-";
      document.getElementById("latestValue").textContent = latest ? latest.value : "-";
      const rateHz = data.sampling_rate_hz;
      document.getElementById("samplingRateHz").textContent = rateHz != null ? rateHz + " Hz" : "-";

      const historyBody = document.getElementById("historyBody");
      historyBody.innerHTML = "";
      (data.recent_packets || []).slice(-20).reverse().forEach((packet) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="mono">${packet.timestamp}</td>
          <td class="mono">${wavelengthLabel(packet.wavelength_code)}</td>
          <td class="mono">${packet.sensor_id}</td>
          <td class="mono">${packet.value}</td>
        `;
        historyBody.appendChild(row);
      });
    }

    async function sendControlData() {
      requestInFlight = true;
      ackStatus.textContent = "发送中...";
      ackStatus.className = "badge badge-secondary status-badge";

      const payload = {
        stream_enabled: document.getElementById("streamEnabled").checked,
        intensity_ma: parseInt(document.getElementById("intensityMa").value, 10) || 0
      };

      const response = await fetch("/update_control_data", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.status === "success") {
        ackStatus.textContent = "命令发送成功";
        ackStatus.className = "badge badge-success status-badge";
      } else {
        ackStatus.textContent = "命令发送失败";
        ackStatus.className = "badge badge-danger status-badge";
      }

      await refreshStatus();
      requestInFlight = false;
    }

    document.getElementById("sendButton").addEventListener("click", sendControlData);
    document.getElementById("streamEnabled").addEventListener("change", sendControlData);
    document.getElementById("intensityMa").addEventListener("change", sendControlData);
    refreshStatus();
    setInterval(refreshStatus, 1000);
  </script>
</body>
</html>
